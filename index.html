<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Legajo</title><script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Disposición: riel oscuro a la izquierda y área de trabajo clara. Redactar parte la pantalla en formulario + hoja de oficio con margen rojo. */
:root{
  --bg:#EDF0EB; --surface:#FFFFFF; --surface-2:#F5F7F3; --ink:#16201C; --muted:#5B675F;
  --line:#D7DDD3; --line-strong:#B7C0B4;
  --accent:#1F4E86; --accent-ink:#FFFFFF; --accent-soft:rgba(70,120,200,.14);
  --rail:#111C18; --rail-ink:#DCE5DF; --rail-muted:#8A9C92; --rail-line:#22322B; --rail-active:#1E2F28;
  --ok:#2E6B4B; --ok-soft:rgba(70,170,120,.17); --warn:#98520F; --warn-soft:rgba(240,170,60,.22); --bad:#A3282A; --bad-soft:rgba(232,92,92,.17);
  --paper:#FFFFFF; --paper-ink:#14171A; --margin:#C0504A; --ph:#FFF0B3; --ph-ink:#5A4300;
  --f-ui:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1311; --surface:#141C18; --surface-2:#1A2420; --ink:#E5EBE6; --muted:#95A39A;
    --line:#25332C; --line-strong:#3A4B41;
    --accent:#86B4EA; --accent-ink:#0A1420; --accent-soft:rgba(134,180,234,.16);
    --rail:#080D0B; --rail-ink:#D6E0D9; --rail-muted:#7F9187; --rail-line:#1B2823; --rail-active:#16231D;
    --ok:#74C99C; --ok-soft:rgba(116,201,156,.16); --warn:#E3A862; --warn-soft:rgba(227,168,98,.18); --bad:#F09294; --bad-soft:rgba(240,146,148,.18);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1311; --surface:#141C18; --surface-2:#1A2420; --ink:#E5EBE6; --muted:#95A39A;
  --line:#25332C; --line-strong:#3A4B41;
  --accent:#86B4EA; --accent-ink:#0A1420; --accent-soft:rgba(134,180,234,.16);
  --rail:#080D0B; --rail-ink:#D6E0D9; --rail-muted:#7F9187; --rail-line:#1B2823; --rail-active:#16231D;
  --ok:#74C99C; --ok-soft:rgba(116,201,156,.16); --warn:#E3A862; --warn-soft:rgba(227,168,98,.18); --bad:#F09294; --bad-soft:rgba(240,146,148,.18);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14.5px;line-height:1.5}
button,input,select,textarea{font:inherit}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- estructura ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;max-height:calc(100vh - env(safe-area-inset-top,0px));overflow-y:auto;display:flex;flex-direction:column;gap:22px;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;color:#F2F6F3}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font:700 24px/1 var(--f-serif);letter-spacing:-.01em;display:block}
.brand span{font-size:11px;color:var(--rail-muted);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:16px}
.nav-g{display:flex;flex-direction:column;gap:2px}
.nav-l{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-muted);padding:0 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:4px;color:var(--rail-ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--rail-line)}
.nav a[aria-current="page"]{background:var(--rail-active);color:#fff;box-shadow:inset 0 0 0 1px var(--rail-line)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.nav .ct{margin-left:auto;font:500 11.5px var(--f-mono);color:var(--rail-muted)}
.nav .ct.hot{color:#fff;background:var(--bad);border-radius:99px;padding:1px 7px}
.rail-foot{margin-top:auto;border-top:1px solid var(--rail-line);padding-top:14px;font-size:12.5px;color:var(--rail-muted);line-height:1.4}
.rail-foot b{display:block;color:var(--rail-ink);font-weight:600}
.main{min-width:0}
.page{max-width:1200px;margin:0 auto;padding-block:28px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:861px){.page{padding-left:max(30px,env(safe-area-inset-left,0px));padding-right:max(30px,env(safe-area-inset-right,0px))}}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:22px}
.head h1{font:700 30px/1.1 var(--f-serif);letter-spacing:-.01em;text-wrap:balance}
.head p{margin-top:6px;color:var(--muted)}
.hact{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- controles ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;padding:8px 14px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:5px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.p-warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.p-bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.p-acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h h2{font:600 17px var(--f-serif)}
.empty{padding:28px 16px;color:var(--muted);text-align:center}
.empty.sm{padding:14px 8px;font-size:13px;border:1px dashed var(--line-strong);border-radius:5px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fld{display:block;min-width:0}
.fld.wide{grid-column:1/-1}
.fld>span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
input,select,textarea{width:100%;min-width:0;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:5px;padding:8px 10px}
textarea{resize:vertical;min-height:80px;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.toolbar input{flex:1 1 260px}
.toolbar select{flex:0 1 200px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;width:100%}
.seg button{border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13.5px;text-align:center;line-height:1.25;min-height:46px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg .n{font:500 11.5px var(--f-mono);opacity:.7;white-space:nowrap}
.dot.warn{background:rgba(232,166,60,.95);box-shadow:0 0 0 3px rgba(232,166,60,.25)}
.hact .seg{width:auto;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr}
.toolbar .seg{flex:1 1 100%}
.dot{margin-left:auto;width:9px;height:9px;border-radius:50%;background:#e06060;box-shadow:0 0 0 3px rgba(224,96,96,.25)}

/* ---------- filas ---------- */
.rows>.row{border-top:1px solid var(--line)}
.rows>.row:first-child{border-top:0}
.row{display:grid;gap:12px 16px;padding:14px 16px}
.row[role="button"]{cursor:pointer}
.row[role="button"]:hover{background:var(--surface-2)}
.causa{grid-template-columns:minmax(0,1fr) auto;align-items:center}
.cline{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:4px}
.ctitle{font:600 16px/1.3 var(--f-serif);text-wrap:balance}
.cfoot{margin-top:4px}
.cact{display:flex;gap:8px}
.venc{grid-template-columns:26px 48px minmax(0,1fr) auto;align-items:center}
.chk{width:22px;height:22px;border:1.5px solid var(--line-strong);border-radius:4px;background:var(--surface);cursor:pointer;padding:0;display:grid;place-items:center;color:var(--accent-ink)}
.chk:hover{border-color:var(--accent)}
.venc.done .chk{background:var(--ok);border-color:var(--ok)}
.venc.done .vt{text-decoration:line-through;color:var(--muted)}
.dblock{text-align:center;font-family:var(--f-mono)}
.dblock b{display:block;font-size:20px;line-height:1.05;font-weight:500}
.dblock span{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.venc.late .dblock b{color:var(--bad)}
.vt{font-weight:600}
.vmeta{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}

/* ---------- panel ---------- */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:20px}
.strip>div{background:var(--surface);padding:14px 18px}
.strip small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.strip b{display:block;font:600 28px/1.2 var(--f-serif);font-variant-numeric:tabular-nums}
.strip b.bad{color:var(--bad)}
.pgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
@media (max-width:860px){.pgrid2{grid-template-columns:1fr}}
.pgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.grp-h{padding:10px 16px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);background:var(--surface-2);border-top:1px solid var(--line)}
.grp-h.bad{color:var(--bad)}
.quick{display:grid;gap:8px;padding:14px 16px}
.quick button{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:12px 14px;border:1px solid var(--line-strong);border-radius:5px;background:var(--surface);cursor:pointer;color:var(--ink)}
.quick button:hover{border-color:var(--accent);background:var(--accent-soft)}
.quick b{font:600 16px var(--f-serif)}
.quick span{font-size:12.5px;color:var(--muted)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;background:var(--warn-soft);color:var(--warn);border-radius:6px;margin-bottom:20px;font-weight:500}
.banner .sp{flex:1}
.mini{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.mini:first-child{border-top:0}
.mini:hover{background:var(--surface-2)}
.mini>div{min-width:0}
.mini b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- clientes ---------- */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.col .n{font-family:var(--f-mono)}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.ccard:hover{border-color:var(--accent)}

/* ---------- calendario ---------- */
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.cal-h h2{font:600 22px var(--f-serif);text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--line);gap:1px}
.cal .dow{background:var(--surface-2);padding:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);text-align:center}
.cell{background:var(--surface);min-height:100px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cell.out{background:var(--surface-2);cursor:default}
.cell.wk{background:var(--surface-2)}
.cell.inh{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--surface) 6px 12px)}
.cell .dn{font:500 12.5px var(--f-mono);color:var(--muted)}
.cell.today .dn{background:var(--ink);color:var(--bg);width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.ev{border:0;text-align:left;font-size:11.5px;font-weight:600;padding:2px 6px;border-radius:3px;background:var(--surface-2);color:var(--ink);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.ev.late{background:var(--bad-soft);color:var(--bad)}
.ev.today{background:var(--warn-soft);color:var(--warn)}
.ev.soon{background:var(--bad-soft);color:var(--bad)}
.ev.done{background:var(--ok-soft);color:var(--ok);text-decoration:line-through}
.more{font-size:11px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:12.5px;color:var(--muted);align-items:center}

/* ---------- honorarios ---------- */
.hon{grid-template-columns:minmax(0,1fr) minmax(120px,220px) auto;align-items:center}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.hon .amt{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- Redactar ---------- */
.gen{display:grid;grid-template-columns:minmax(300px,430px) minmax(0,1fr);gap:24px;align-items:start}
.gen-form{display:flex;flex-direction:column;gap:18px;min-width:0}
.step{padding:16px;display:flex;flex-direction:column;gap:12px}
.step h3{display:flex;align-items:center;gap:10px;font:600 16px var(--f-serif)}
.step h3 i{font:500 12px var(--f-mono);font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.tpls{display:grid;gap:6px}
.tpl{display:flex;flex-direction:column;gap:1px;text-align:left;padding:9px 12px;border:1px solid var(--line);border-radius:5px;background:var(--surface);cursor:pointer;color:var(--ink)}
.tpl span{font-size:12.5px;color:var(--muted)}
.tpl:hover{border-color:var(--line-strong)}
.tpl.on{border-color:var(--accent);background:var(--accent-soft)}
.sub-h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-top:4px}
.gen-prev{position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;gap:10px;min-width:0}
.ptool{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.ptool .pt{flex:1 1 200px;min-width:0}
.ptool .pt b{font:600 17px var(--f-serif);display:block}
/* Hoja: medidas tomadas de los modelos del estudio.
   Oficio legal 21,59 x 35,56 cm, Times New Roman 11 pt, interlineado doble (2 x 1,15 = 2,3),
   margen izquierdo 5,5 cm, derecho 2 cm, superior 3 cm, inferior 5 cm.
   Oficios: superior 2 cm, inferior 1,25 cm. */
.sheet-wrap{overflow:auto;min-height:0;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);padding:10px}
.sheet{position:relative;width:max-content;margin:0 auto;box-shadow:0 14px 30px -20px rgba(0,0,0,.5)}
.paper{box-sizing:border-box;width:21.59cm;min-height:35.56cm;background:#fff;color:#000;
  font-family:'Times New Roman','Liberation Serif',Times,serif;font-size:11pt;line-height:2.3;
  padding:3cm 2cm 5cm 5.5cm;outline:none;zoom:var(--z,1)}
.paper[data-kind="oficio"]{padding:2cm 2cm 1.25cm 5.5cm}
.paper p{margin:0 0 10pt;text-align:justify;text-indent:0}
.paper[data-kind="oficio"] p,.paper[data-kind="escrito"] p{text-indent:1.27cm}
.paper p.noind,.paper p.hd,.paper p.title,.paper p.right,.paper p.addr,.paper p.h,.paper p.objeto,.paper p.center{text-indent:0}
.paper p.hd{text-align:center;font-weight:700;font-size:12pt;margin:0}
.paper[data-kind="oficio"] p.hd{line-height:1.32}
.paper p.title{text-align:center;font-weight:700;font-size:12pt;margin:0 0 10pt}
.paper[data-kind="oficio"] p.title{line-height:1.725;margin-bottom:0}
.paper p.right{text-align:right;line-height:1.725}
.paper p.addr{text-align:left;line-height:1.32}
.paper p.objeto{text-align:right}
.paper p.h{text-align:left}
.paper p.center{text-align:center}
.paper .firma,.paper .sello{width:7.75cm;text-align:center;line-height:1.32;margin-top:1cm;break-inside:avoid}
.paper .firma{margin-left:auto}
.paper .fline{border-top:1px solid #000;margin-bottom:3pt}
.paper blockquote.cita{margin:0 0 10pt 0;font-style:italic}
.paper blockquote.cita p{text-indent:0}
.paper ol.alpha{list-style:lower-alpha;margin:0 0 10pt 1.9cm;padding:0}
.paper ol.alpha li{margin-bottom:0;text-align:justify}
.ph{background:#9EF59E;color:#000;padding:0;font-family:inherit;font-size:inherit;line-height:inherit}
.pfoot{font-size:12.5px;color:var(--muted)}
.tblw{overflow:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr[data-act]{cursor:pointer}
.tbl tbody tr[data-act]:hover{background:var(--surface-2)}
.tbl tbody tr.t-warn td{background:rgba(240,170,60,.10)}
.tbl tbody tr.t-crit td{background:rgba(232,92,92,.10)}
.tbl tbody tr.t-hoy td{background:rgba(232,92,92,.18)}
.tbl tbody tr.t-crit td:first-child,.tbl tbody tr.t-hoy td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.tbl tbody tr.t-warn td:first-child{box-shadow:inset 3px 0 0 rgba(240,170,60,.7)}
.mini.t-warn,.row.venc.t-warn{background:rgba(240,170,60,.10)}
.mini.t-crit,.row.venc.t-crit{background:rgba(232,92,92,.10)}
.mini.t-hoy,.row.venc.t-hoy{background:rgba(232,92,92,.18)}
.hist{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.hist-it{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.scan-v{width:100%;max-height:46vh;background:#000;border-radius:6px;object-fit:cover}
.tbl select{width:auto;padding:4px 6px;font-size:12.5px}
.adj{display:flex;flex-direction:column;gap:8px}
.adj-it{display:flex;flex-wrap:wrap;align-items:center;gap:10px}

async function authReq(grant,body){
  const r=await fetch(CFG.url+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{'apikey':CFG.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(j.error_description||j.msg||'auth'),{status:r.status});
  const s={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000-60000,email:(j.user&&j.user.email)||CLOUD.email};
  CLOUD.sess=s;CLOUD.email=s.email;sessPut(s);return s;
}
async function token(){
  const s=CLOUD.sess;if(!s)throw Object.assign(new Error('nologin'),{status:401});
  if(Date.now()>s.exp)await authReq('refresh_token',{refresh_token:s.refresh});
  return CLOUD.sess.access;
}
async function rest(path,opt){
  const t=await token();opt=opt||{};
  const r=await fetch(CFG.url+'/rest/v1/'+path,Object.assign({},opt,{headers:Object.assign({'apikey':CFG.key,'Authorization':'Bearer '+t,'Content-Type':'application/json'},opt.headers||{})}));
  if(r.status===401)throw Object.assign(new Error('nologin'),{status:401});
  if(!r.ok)throw new Error('http '+r.status);
  return r.status===204?null:r.json();
}
const pull=async()=>{const a=await rest('legajo_data?id=eq.1&select=data,version');if(!a||!a[0])throw new Error('Falta la tabla legajo_data (ver LEEME)');return a[0]};
function normDB(o){

function mergeDocs(base,local,remote){
  const out=Object.assign({},remote);
  SBCOLS.forEach(k=>{
    const B=new Map((base[k]||[]).map(x=>[x.id,x])),L=new Map((local[k]||[]).map(x=>[x.id,x])),R=new Map((remote[k]||[]).map(x=>[x.id,x]));
    const ids=[];(local[k]||[]).concat(remote[k]||[]).forEach(x=>{if(ids.indexOf(x.id)<0)ids.push(x.id)});
    const res=[];
    ids.forEach(id=>{
      const b=B.get(id),l=L.get(id),r=R.get(id);
      if(l&&r)res.push(b&&jeq(l,b)?r:l);
      else if(l)res.push(l);          // lo agregué o lo edité yo
      else if(r){if(!b||!jeq(r,b))res.push(r)}  // otro lo agregó/editó; si yo lo borré y no cambió, queda borrado
    });
    out[k]=res;
  });
  Object.keys(local).forEach(k=>{if(SBCOLS.indexOf(k)<0&&!jeq(local[k],base[k]))out[k]=local[k]});
  return out;
}
async function pushNow(){
  if(CLOUD.busy)return;CLOUD.busy=true;CLOUD.dirty=false;setSt('Guardando…');
  try{
    if(ADM.rec)DB._adm=ADM.rec;
    for(let n=0;n<4;n++){
      const rows=await rest('legajo_data?id=eq.1&version=eq.'+CLOUD.ver,{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify({data:DB})});
      if(rows&&rows.length){CLOUD.ver=rows[0].version;CLOUD.base=clone(DB);CLOUD.failed=false;setSt('Guardado '+new Date().toTimeString().slice(0,5));return}
      const rm=await pull();                                   // alguien guardó antes: unimos los cambios
      const merged=mergeDocs(CLOUD.base||{},DB,rm.data||{});
      normDB(merged);CLOUD.ver=rm.version;CLOUD.base=clone(rm.data||{});
      if(!MODAL)render();
    }
    throw new Error('conflicto');
  }catch(e){
    CLOUD.dirty=true;
    if(e.status===401){cloudLogin('Tu sesión venció. Ingresá de nuevo.').then(()=>{CLOUD.dirty=true;cloudSave(true)});}
    else{setSt('Sin conexión: se reintenta solo');if(!CLOUD.failed){CLOUD.failed=true;toast('No se pudo guardar. Se reintenta solo; no cierres esta página.')}clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(()=>cloudSave(true),6000)}
  }finally{CLOUD.busy=false;if(CLOUD.dirty&&!CLOUD.failed)cloudSave()}
}
function cloudSave(now){
  CLOUD.dirty=true;clearTimeout(CLOUD.timer);

async function refreshRemote(){

function cloudLogin(msg){
  return new Promise(res=>{
    let o=document.getElementById('login');if(o)o.remove();
    o=document.createElement('div');o.id='login';
    o.style.cssText='position:fixed;inset:0;z-index:200;background:var(--bg,#eef0ec);display:grid;place-items:center;padding:20px';
    o.innerHTML='<form class="card sp-card" style="width:100%;max-width:380px;padding:26px"><h1 style="font:700 28px var(--f-serif,serif);margin:0 0 4px">Legajo</h1><p class="small muted" style="margin:0 0 18px">Gestión de estudio · ingresá con tu usuario</p><label class="fld"><span>Correo</span><input name="email" type="email" autocomplete="username" required></label><label class="fld" style="margin-top:10px"><span>Contraseña</span><input name="pw" type="password" autocomplete="current-password" required></label><p id="login-err" class="small" style="color:var(--bad);min-height:20px;margin:10px 0 0">'+(msg||'')+'</p><button class="btn primary" type="submit" style="width:100%;margin-top:6px;padding:12px">Ingresar</button></form>';
    document.body.appendChild(o);
    const f=o.querySelector('form'),err=o.querySelector('#login-err');
    try{const last=localStorage.getItem('legajo.email');if(last)f.elements.email.value=last}catch(e){}
    f.addEventListener('submit',async ev=>{
      ev.preventDefault();err.textContent='Ingresando…';
      try{CLOUD.email=f.elements.email.value.trim();await authReq('password',{email:CLOUD.email,password:f.elements.pw.value});try{localStorage.setItem('legajo.email',CLOUD.email)}catch(e){}o.remove();res()}
      catch(e){err.textContent=e.status===400||e.status===401?'Correo o contraseña incorrectos.':'No se pudo conectar. Revisá tu internet.'}
    });
  });
}
function cloudLogout(){sessPut(null);CLOUD.sess=null;location.reload()}
async function cloudStart(){
  if(!CFG.url||!CFG.key){document.body.innerHTML='<div style="max-width:560px;margin:12vh auto;padding:0 20px;font-family:system-ui"><h1>Falta configurar</h1><p>Completá el archivo <b>config.js</b> con la dirección y la clave pública de tu proyecto (ver LEEME).</p></div>';throw new Error('sin config')}
  CLOUD.sess=sessGet();if(CLOUD.sess)CLOUD.email=CLOUD.sess.email||'';
  let r=null;
  for(;;){
    try{if(!CLOUD.sess)await cloudLogin();r=await pull();break}
    catch(e){
      if(e.status===401||e.message==='nologin'){CLOUD.sess=null;sessPut(null);continue}
      document.body.innerHTML='<div style="max-width:560px;margin:12vh auto;padding:0 20px;font-family:system-ui"><h1>No se pudo conectar</h1><p>'+esc(e.message||'')+'</p><p><a href="">Reintentar</a></p></div>';throw e;
    }
  }
  if(r.data&&Array.isArray(r.data.causas)){normDB(r.data);CLOUD.ver=r.version;CLOUD.base=clone(r.data)}
  else{DB=blankDB();fixDB();CLOUD.ver=r.version;CLOUD.base={};await pushNow()}
  setSt('Conectado');
  CLOUD.poll=setInterval(refreshRemote,15000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshRemote()});
  window.addEventListener('online',()=>{if(CLOUD.dirty)cloudSave(true);else refreshRemote()});
}

function vstate(v){
  if(v.estado==='Completado')return 'done';
  const d=diffDays(parse(v.fecha),today());
  return d<0?'late':d===0?'today':d<=7?'soon':'later';
}

const byFecha=(a,b)=>a.fecha.localeCompare(b.fecha);
function isInhabil(d){
  const w=d.getDay();
  if(w===0||w===6)return true;
  if(d.getMonth()===0)return true;
  return DB.inhabiles.indexOf(iso(d))>=0;
}
function plazoHabil(desde,n){
  let d=new Date(desde),c=0,guard=0;
  while(c<n&&guard<800){d=addDays(d,1);guard++;if(!isInhabil(d))c++}
  return d;
}

async function decodeCanvas(cv){

async function decodeFile(file){

  cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);

/* El ticket del Registro trae el número y la fecha impresos (sin código de barras): se leen con OCR */
const OCR={w:null};
function loadTess(){
  if(window.Tesseract)return Promise.resolve(window.Tesseract);
  return new Promise((res,rej)=>{const e=document.createElement('script');e.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';e.onload=()=>res(window.Tesseract);e.onerror=()=>rej(new Error('No se pudo cargar el lector de texto (¿hay internet?)'));document.head.appendChild(e)});
}
function prepOcr(cv0,W){
  const k=Math.min(1,W/Math.max(cv0.width,cv0.height)),cv=document.createElement('canvas');
  cv.width=Math.round(cv0.width*k);cv.height=Math.round(cv0.height*k);
  const x=cv.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(cv0,0,0,cv.width,cv.height);
  const im=x.getImageData(0,0,cv.width,cv.height),d=im.data,h=new Uint32Array(256);
  for(let i=0;i<d.length;i+=4){const g=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000|0;d[i]=g;h[g]++}
  const n=d.length/4;let a=0,lo=0,hi=255;
  for(let i=0;i<256;i++){a+=h[i];if(a>=n*.02){lo=i;break}}
  a=0;for(let i=255;i>=0;i--){a+=h[i];if(a>=n*.02){hi=i;break}}
  const sc=255/Math.max(1,hi-lo);
  for(let i=0;i<d.length;i+=4){const v=Math.max(0,Math.min(255,(d[i]-lo)*sc));d[i]=d[i+1]=d[i+2]=v}
  x.putImageData(im,0,0);return cv;
}
function normNum(v){const m=String(v||'').match(/\d{4,8}\s*\/\s*\d/);return m?m[0].replace(/\s/g,''):String(v||'').trim()}
function parseTicket(txt){
  txt=String(txt||'').replace(/[Oo](?=\d)|(?<=\d)[Oo]/g,'0');
  const n=txt.match(/(?<!\d)(\d{7})\s*\/\s*(\d)(?!\d)/)||txt.match(/(\d{5,8})\s*\/\s*(\d)(?!\d)/),f=txt.match(/(\d{2})\s*\/\s*(\d{2})\s*\/\s*(20\d{2})/);
  let fecha='';
  if(f){const d=+f[1],m=+f[2];if(d>=1&&d<=31&&m>=1&&m<=12)fecha=f[3]+'-'+f[2]+'-'+f[1]}
  return {code:n?n[1]+'/'+n[2]:'',fecha:fecha};
}
async function ocrCanvas(cv,onMsg){
  const T=await loadTess();
  if(!OCR.w){if(onMsg)onMsg('Preparando el lector (la primera vez tarda unos segundos)…');OCR.w=await T.createWorker('eng',1,{});await OCR.w.setParameters({tessedit_pageseg_mode:'6'})}
  /* el texto punteado se lee distinto según el tamaño: se prueba con varios y gana el que más se repite */
  const hoy=iso(today()),min=iso(addDays(today(),-45)),max=iso(addDays(today(),1));
  const votos={},fv={};let best='';
  for(const W of [1400,2000,1000,1700,1200]){
    if(onMsg)onMsg('Leyendo el ticket…');
    const r=await OCR.w.recognize(prepOcr(cv,W)),t=parseTicket(r.data.text);
    if(t.code)votos[t.code]=(votos[t.code]||0)+1;
    if(t.fecha&&t.fecha>=min&&t.fecha<=max)fv[t.fecha]=(fv[t.fecha]||0)+1;
    best=Object.keys(votos).sort((a,b)=>votos[b]-votos[a]||(/^\d{7}\/\d$/.test(b)-/^\d{7}\/\d$/.test(a)))[0]||'';
    if(best&&votos[best]>=2&&Object.keys(fv).length)break;
  }
  const f=Object.keys(fv).sort((a,b)=>fv[b]-fv[a])[0]||'';
  return {code:best,fecha:f||hoy};
}

function estadoVenc(t){

  const key=d<0?'vencido':d===0?'hoy':d<=crit?'por_vencer':'ok';

function saveCarteras(){
  const L=$('#a-cart').value.split('\n').map(s=>s.trim()).filter(Boolean),out=[],seen={};
  for(const s of L){
    const p=s.split('|'),id=(p[0]||'').trim();let nombre=(p.slice(1).join('|')||'').trim();const propia=/\*\s*$/.test(nombre);nombre=nombre.replace(/\*\s*$/,'').trim();
    if(!id||!nombre){toast('Cada línea va como: número | nombre');return}
    if(seen[id]){toast('El número '+id+' está repetido');return}
    seen[id]=1;out.push(propia?{id:id,nombre:nombre,propia:true}:{id:id,nombre:nombre});
  }
  if(!out.length){toast('Cargá al menos una cartera');return}
  DB.carteras=out;save();render();toast('Carteras guardadas');
}

/* ---- números y fechas en letras ---- */
const N_U=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
const N_D=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
const N_C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
const apoc=t=>t.replace(/veintiuno$/,'veintiún').replace(/(^|\s)uno$/,'$1un');
function n999(n){
  if(!n)return '';
  if(n===100)return 'cien';
  const c=Math.floor(n/100),r=n%100;let t=N_C[c];
  if(r){if(t)t+=' ';if(r<30)t+=N_U[r];else t+=N_D[Math.floor(r/10)]+(r%10?' y '+N_U[r%10]:'')}
  return t;
}
function nLetras(n){
  n=Math.floor(Math.abs(n));
  if(n===0)return 'cero';
  const mill=Math.floor(n/1e6),mil=Math.floor((n%1e6)/1000),uni=n%1000,out=[];
  if(mill)out.push(mill===1?'un millón':apoc(nLetras(mill))+' millones');
  if(mil)out.push(mil===1?'mil':apoc(n999(mil))+' mil');
  if(uni)out.push(n999(uni));
  return out.join(' ');
}
function parseMonto(t){
  t=String(t||'').replace(/[^\d.,]/g,'');
  if(!t)return NaN;
  if(t.indexOf(',')>=0)t=t.replace(/\./g,'').replace(',','.');
  else if(!(/^\d+\.\d{1,2}$/.test(t)))t=t.replace(/\./g,'');
  return parseFloat(t);
}
const fmtMonto=n=>n.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
function montoLetras(t){
  const n=parseMonto(t);if(isNaN(n))return null;
  const ent=Math.floor(n),cen=Math.round((n-ent)*100);
  return 'PESOS '+nLetras(ent).toUpperCase()+(cen?' CON '+nLetras(cen).toUpperCase()+' CENTAVOS':'');
}
function fechaLetras(t){
  if(!t)return null;const d=parse(t);if(isNaN(d.getTime()))return null;
  return (d.getDate()===1?'primero':nLetras(d.getDate()))+' de '+MESES[d.getMonth()]+' de '+nLetras(d.getFullYear());
}

const cierre=v=>{const d=parse(v.fecha);return isNaN(d.getTime())?{d:'__',m:'__________',y:'____'}:{d:d.getDate(),m:MESES[d.getMonth()],y:d.getFullYear()}};

function commonDefaults(){const F=DB.firma;return {lugar:F.ciudad||'',fecha:iso(today()),rol:/^Dra/i.test(F.abogado||'')?'apoderada':'apoderado'}}
function setTpl(id){
  const t=TPL.find(x=>x.id===id);if(!t)return;
  const keep={};COMMON.forEach(fd=>{if(GEN.vals[fd.k]!==undefined)keep[fd.k]=GEN.vals[fd.k]});
  GEN.tpl=id;GEN.cat=t.cat;GEN.vals=Object.assign(commonDefaults(),keep);
  t.fields.forEach(fd=>{GEN.vals[fd.k]=fd.def!==undefined?fd.def:(fd.type==='select'?fd.opts[0]:'')});
  GEN.edited=false;GEN.draftId=null;
}
function applyCausa(){
  const c=cau(GEN.causaId),V=GEN.vals;
  if(!c){V.caratula='';V.expte='';V.juzgado='';V.secretaria='';V.cliente='';return}
  const cl=cli(c.clienteId);
  V.caratula=c.caratula;V.expte=c.numero;V.juzgado=c.juzgado;V.secretaria=c.secretaria||'';V.cliente=cl?cl.nombre:'';
}
function initGen(){
  if(GEN.init)return;GEN.init=true;
  setTpl(GEN.tpl);
  if(DB.causas[0]){GEN.causaId=DB.causas[0].id;applyCausa()}
}
function vRedactar(){
  if(GEN.causaId&&!cau(GEN.causaId))GEN.causaId='';

  const seg='<div class="seg" role="group" aria-label="Tipo de documento">'+CATS.map(c=>'<button type="button" data-act="gen-cat" data-cat="'+c[0]+'" aria-pressed="'+(GEN.cat===c[0])+'">'+c[1]+'<span class="n">'+TPL.filter(x=>x.cat===c[0]).length+'</span></button>').join('')+'</div>';
  const tpls=list.map(x=>'<button type="button" class="tpl'+(x.id===GEN.tpl?' on':'')+'" data-act="gen-tpl" data-id="'+x.id+'" aria-pressed="'+(x.id===GEN.tpl)+'"><b>'+esc(x.name)+'</b><span>'+esc(x.desc)+'</span></button>').join('');
  const causaSel='<label class="fld" for="g-causa"><span>Causa</span><select id="g-causa"><option value="">Sin causa, completar a mano</option>'+DB.causas.map(c=>'<option value="'+c.id+'"'+(c.id===GEN.causaId?' selected':'')+'>'+esc(c.numero)+' · '+esc(shortCar(c.caratula))+'</option>').join('')+'</select></label>';
  return head('Redactar','Elegí el modelo, la causa y completá los campos. La hoja se arma sola.',seg)+
    '<div class="gen"><form class="gen-form" id="gen-form" autocomplete="off">'+
      '<section class="card step"><h3><i>1</i>Modelo</h3><div class="tpls">'+tpls+'</div></section>'+
      '<section class="card step"><h3><i>2</i>Causa</h3>'+causaSel+'<div class="fgrid">'+fieldsHTML(COMMON,GEN.vals,'g-')+'</div></section>'+
      '<section class="card step"><h3><i>3</i>Contenido</h3><div class="fgrid">'+fieldsHTML(t.fields,GEN.vals,'g-')+'</div></section>'+

function baseProps(kind,cls){
  const o={align:'both',line:480,first:kind==='testimonio'?0:720,left:0,right:0,before:0,after:200,size:22,b:0,keep:0};
  if(cls.hd){o.align='center';o.b=1;o.size=24;o.after=0;o.first=0;o.line=kind==='oficio'?276:480}
  if(cls.title){o.align='center';o.b=1;o.size=24;o.first=0;o.line=kind==='oficio'?360:480;if(kind==='oficio')o.after=0}
  if(cls.right){o.align='right';o.first=0;o.line=360}
  if(cls.addr){o.align='left';o.first=0;o.line=276}
  if(cls.objeto){o.align='right';o.first=0}
  if(cls.noind){o.first=0}
  if(cls.h){o.first=0;o.align='left';o.keep=1}
  if(cls.center){o.align='center';o.first=0}
  return o;
}
function runsOf(node,st,out){
  node.childNodes.forEach(n=>{
    if(n.nodeType===3){
      const t=n.nodeValue.replace(/ /g,' ').replace(/\s+/g,' ');
      if(t)out.push({t:t,b:st.b,i:st.i,u:st.u,ph:st.ph});
    }else if(n.nodeType===1){
      if(n.tagName==='BR'){out.push({br:1});return}
      const x=Object.assign({},st),g=n.tagName,fw=n.style&&n.style.fontWeight;
      if(g==='B'||g==='STRONG'||fw==='bold'||Number(fw)>=600)x.b=1;
      if(g==='I'||g==='EM'||(n.style&&n.style.fontStyle==='italic'))x.i=1;
      if(g==='U'||(n.style&&/underline/.test(n.style.textDecoration||'')))x.u=1;
      if(n.classList&&n.classList.contains('ph'))x.ph=1;
      runsOf(n,x,out);
    }
  });
}
function blockFrom(el,kind,extra){
  const cls={};if(el.classList)el.classList.forEach(c=>{cls[c]=1});
  const o=Object.assign(baseProps(kind,cls),extra||{}),runs=[];
  runsOf(el,extra&&extra.i?{i:1}:{},runs);
  o.runs=runs;return o;
}

  const out=[];
  Array.from(paper.children).forEach(el=>{
    const tag=el.tagName,cl=el.classList;
    if(cl.contains('firma')||cl.contains('sello')){
      const pos=cl.contains('firma')?{left:PG.w-MG[kind].l-MG[kind].r-SIGN_W,right:0}:{left:0,right:PG.w-MG[kind].l-MG[kind].r-SIGN_W};
      let first=true;
      Array.from(el.children).forEach(ch=>{
        const b=blockFrom(ch,kind);
        Object.assign(b,{align:'center',first:0,line:276,after:0,left:pos.left,right:pos.right,keep:1});
        if(ch.classList.contains('fline')){b.runs=[{t:'_'.repeat(34)}];b.before=first?700:0}
        first=false;out.push(b);
      });
      if(out.length)out[out.length-1].after=200;
    }else if(tag==='BLOCKQUOTE'){
      Array.from(el.children).forEach(ch=>out.push(blockFrom(ch,kind,{left:0,first:0,i:1})));
    }else if(tag==='OL'){
      Array.from(el.children).forEach((li,i)=>{
        const b=blockFrom(li,kind,{left:1080,first:-360,after:60});
        b.runs.unshift({t:String.fromCharCode(97+i)+') '});out.push(b);
      });
    }else out.push(blockFrom(el,kind));
  });
  return out;
}

  const ct=H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>';
  const rels=H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';

/* ---- PDF ---- */
function pdfBlob(model,kind){
  const doc=new window.jspdf.jsPDF({unit:'pt',format:[612,1008],compress:true});
  const M=MG[kind],tw=v=>v/20,L=tw(M.l),T=tw(M.t),B=1008-tw(M.b),W=612-L-tw(M.r);
  const setF=(r,b,sz)=>{const bo=r.b||b.b;doc.setFont('times',bo&&r.i?'bolditalic':bo?'bold':r.i?'italic':'normal');doc.setFontSize(sz)};
  let y=T;
  model.forEach(b=>{
    const sz=b.size/2,lh=sz*1.15*(b.line/240);
    y+=tw(b.before||0);
    const chunks=[];let cur=null;
    b.runs.forEach(r=>{
      if(r.br){if(cur){chunks.push(cur);cur=null}chunks.push({br:1});return}
      r.t.split(/(\s+)/).forEach(seg=>{
        if(!seg)return;
        if(/^\s+$/.test(seg)){
          if(cur){cur.space=true;chunks.push(cur);cur=null}
          else if(chunks.length&&!chunks[chunks.length-1].br)chunks[chunks.length-1].space=true;
          return;
        }
        if(!cur)cur={parts:[],space:false};
        setF(r,b,sz);cur.parts.push({t:seg,r:r,w:doc.getTextWidth(seg)});
      });
    });
    if(cur)chunks.push(cur);
    const base=W-tw(b.left)-tw(b.right||0),firstOff=tw(b.first),avail0=base-firstOff;
    const lines=[];let line={ch:[],w:0};
    chunks.forEach(c=>{
      if(c.br){line.hard=true;lines.push(line);line={ch:[],w:0};return}
      const lp=c.parts[c.parts.length-1];setF(lp.r,b,sz);
      c.cw=c.parts.reduce((a,q)=>a+q.w,0);c.sw=c.space?doc.getTextWidth(' '):0;
      const av=lines.length===0?avail0:base,prev=line.ch.length?line.ch[line.ch.length-1].sw:0;
      if(line.ch.length&&line.w+prev+c.cw>av+0.01){lines.push(line);line={ch:[],w:0}}
      line.w+=(line.ch.length?line.ch[line.ch.length-1].sw:0)+c.cw;line.ch.push(c);
    });
    line.hard=true;lines.push(line);
    lines.forEach((ln,li)=>{
      const isFirst=li===0,av=isFirst?avail0:base,x0=L+tw(b.left)+(isFirst?firstOff:0);
      if(y+lh>B&&y>T+1){doc.addPage();y=T}
      let x=x0,extra=0;const gaps=ln.ch.length-1;
      if(b.align==='both'&&!ln.hard&&gaps>0)extra=(av-ln.w)/gaps;
      else if(b.align==='center')x=x0+(av-ln.w)/2;
      else if(b.align==='right')x=x0+(av-ln.w);
      const by=y+lh*0.5+sz*0.33;
      ln.ch.forEach(c=>{
        c.parts.forEach(q=>{
          setF(q.r,b,sz);
          if(q.r.ph){doc.setFillColor(158,245,158);doc.rect(x,by-sz*0.85,q.w,sz*1.05,'F')}
          doc.setTextColor(0,0,0);doc.text(q.t,x,by);
          if(q.r.u){doc.setLineWidth(0.5);doc.setDrawColor(0,0,0);doc.line(x,by+1.6,x+q.w,by+1.6)}
          x+=q.w;
        });
        x+=c.sw+extra;
      });
      y+=lh;
    });
    y+=tw(b.after);
  });
  return doc.output('blob');
}

/* ---- guardar archivos ---- */
const DRV={mode:'dl'};
try{if(localStorage.getItem('legajo.dest')==='drive')DRV.mode='drive'}catch(e){}
const MIMES={docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',pdf:'application/pdf',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'};
const toB64=b=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=()=>ko(r.error);r.readAsDataURL(b)});
function driveMsg(e){
  const c=e&&e.code;
  if(c==='needs_reauth')return 'Hay que reconectar Google Drive en los conectores de Claude.';
  if(c==='approval_required'||c==='not_granted'||c==='declined')return 'Falta el permiso para usar Google Drive.';
  if(c==='too_large')return 'El archivo es demasiado grande para subirlo a Drive desde acá.';
  if(c==='no_tool')return 'El conector de Drive no permite crear archivos.';
  if(c==='no_mcp'||c==='server_not_connected'||c==='not_in_manifest')return 'Google Drive no está conectado.';
  return 'No se pudo subir a Google Drive.';
}
async function driveInfo(){
  if(!CAP.mcp)return {err:'no_mcp'};
  let lt;try{lt=await CAP.mcp.listTools()}catch(e){return {err:(e&&e.code)||'error'}}
  const s=(lt.servers||[]).find(x=>/google\s*drive/i.test(x.server)&&(x.kind||'connector')==='connector');
  if(!s||!s.tools||!s.tools.length)return {err:'server_not_connected'};
  return {s:s,fileArgs:!!lt.fileArgs};
}
async function driveUpload(name,blob){
  const info=await driveInfo();if(info.err)throw {code:info.err};
  const srv=info.s.server,tool=info.s.tools.find(t=>t.name==='create_file')||info.s.tools.find(t=>/create|upload/i.test(t.name));
  if(!tool)throw {code:'no_tool'};
  let props={};try{const d=await CAP.mcp.describeTool(srv,tool.name);props=(d.inputSchema&&d.inputSchema.properties)||{}}catch(e){}
  const mime=MIMES[name.split('.').pop().toLowerCase()]||'application/octet-stream';
  const pick=(...ks)=>ks.find(k=>k in props)||ks[0],input={};
  input[pick('title','name','fileName')]=name;
  const ck=pick('base64Content','contentBase64','content_base64','fileContent','content');
  if(info.fileArgs&&/base64/i.test(ck))input[ck]={$file:{data:blob,name:name,type:mime}};
  else{if(blob.size>700000)throw {code:'too_large'};input[ck]=await toB64(blob)}
  input[pick('contentMimeType','content_mime_type','mimeType','mime_type')]=mime;
  /* que Drive guarde el archivo tal cual (.docx, .pdf, .xlsx) y no lo convierta a Google Docs */
  if(!Object.keys(props).length||'disableConversionToGoogleType' in props)input.disableConversionToGoogleType=true;
  const raw=((DB.firma&&DB.firma.driveFolder)||'').trim();
  const fid=raw?((raw.match(/folders\/([-\w]{10,})/)||raw.match(/[?&]id=([-\w]{10,})/)||[0,raw])[1]):'';
  if(fid)input[pick('parentId','parent_id','folderId','folder_id')]=fid;
  return CAP.mcp.callTool(srv,tool.name,input);
}
async function saveFile(name,blob,okMsg){
  if(DRV.mode==='drive'){
    try{await driveUpload(name,blob);toast('Subido a Google Drive: '+name);return}
    catch(e){okMsg=driveMsg(e)+' Se descargó el archivo.'}
  }
  if(CAP.dl){
    try{await CAP.dl.save({filename:name,data:blob});toast(okMsg||'Archivo guardado')}
    catch(e){if(!e||e.code!=='declined')toast('No se pudo guardar el archivo')}
    return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast(okMsg||'Archivo generado');
}

/* =============== clave de administrador =============== */
const ADM={rec:null};

async function sha256(t){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))>>>0;return 'f'+h.toString(16)}
}
const admHash=(salt,pw)=>sha256(salt+'|'+pw);
function persistAdm(){DB._adm=ADM.rec;save()}
function adminGate(msg,run){
  if(!ADM.rec){admSet('Para continuar con esto ('+msg+') primero hay que definir la clave de administrador. Se va a pedir para borrar registros y restablecer datos. Al guardarla, se ejecuta la acción.',run);return}
  openModal('<form id="adm-form"><h2>Clave de administrador</h2><p class="muted" style="margin:6px 0 12px">'+esc(msg)+'</p><label class="fld"><span>Clave</span><input type="password" id="adm-pin" autocomplete="off"></label><div class="mact" style="margin-top:14px"><span class="sp"></span><button type="button" class="btn" data-act="m-close">Cancelar</button><button class="btn primary" type="submit">Confirmar</button></div></form>',{adm:'ask',run:run});
  const i=$('#adm-pin');if(i)i.focus();
}
function admSet(msg,run){
  openModal('<form id="adm-form"><h2>Definir clave</h2><p class="muted" style="margin:6px 0 12px">'+esc(msg)+'</p><div class="fgrid"><label class="fld"><span>Clave nueva</span><input type="password" id="adm-pin" autocomplete="new-password"></label><label class="fld"><span>Repetir clave</span><input type="password" id="adm-pin2" autocomplete="new-password"></label></div><div class="mact" style="margin-top:14px"><span class="sp"></span><button type="button" class="btn" data-act="m-close">Cancelar</button><button class="btn primary" type="submit">Guardar clave</button></div></form>',{adm:'set',run:run});
  const i=$('#adm-pin');if(i)i.focus();
}
async function admSubmit(){
  const m=MODAL;if(!m)return;const pin=$('#adm-pin').value;
  if(m.adm==='ask'){
    if(await admHash(ADM.rec.salt,pin)!==ADM.rec.hash){toast('Clave incorrecta');const i=$('#adm-pin');i.value='';i.focus();return}
    const run=m.run;closeModal();if(run)run();return;
  }
  if(pin.length<4){toast('Usá al menos 4 caracteres');return}
  if(pin!==$('#adm-pin2').value){toast('Las claves no coinciden');return}
  const salt=uid()+uid();ADM.rec={salt:salt,hash:await admHash(salt,pin)};persistAdm();
  const run=m.run;closeModal();toast('Clave guardada');if(run)run();else render();
}

const COLS=['clientes','causas','venc','honorarios','borradores','caratulas','tramites'];
const NEWEST={clientes:1,causas:1,caratulas:1,tramites:1};
const SYNC={db:null,ready:false,last:{},lastCfg:'',got:{},dirty:false,errAt:0};
const cfgJson=()=>JSON.stringify({firma:DB.firma,inhabiles:DB.inhabiles,demo:!!DB.demo,carteras:DB.carteras||[]});
function syncErr(e){const t=Date.now();if(t-SYNC.errAt>30000){SYNC.errAt=t;toast('No se pudo sincronizar con el equipo')}}
function ensureOrder(){
  const now=Date.now();
  COLS.forEach(col=>{DB[col].forEach((x,i)=>{if(x._o==null)x._o=NEWEST[col]?now-i:now+i})});
}
function pushRemote(){
  const db=SYNC.db;if(!db||!SYNC.ready)return;
  ensureOrder();
  COLS.forEach(col=>{
    const last=SYNC.last[col]||{},cur={};
    DB[col].forEach(x=>{const js=JSON.stringify(x);cur[x.id]=js;if(last[x.id]!==js)db.doc(col+'/'+x.id).set(JSON.parse(js)).catch(syncErr)});
    Object.keys(last).forEach(id=>{if(!(id in cur))db.doc(col+'/'+id).delete().catch(syncErr)});
    SYNC.last[col]=cur;
  });
  const cj=cfgJson();
  if(cj!==SYNC.lastCfg){SYNC.lastCfg=cj;db.doc('config/main').set(JSON.parse(cj)).catch(syncErr)}
}
const isEditing=()=>{const a=document.activeElement;return !!a&&(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)||a.isContentEditable)};
function refreshSoon(){
  if(MODAL||isEditing()||route()==='redactar'){SYNC.dirty=true;renderNav();return}
  render();
}
document.addEventListener('focusout',()=>{
  if(!SYNC.dirty)return;
  setTimeout(()=>{if(SYNC.dirty&&!MODAL&&!isEditing()&&route()!=='redactar'){SYNC.dirty=false;render()}},250);
});
function applyRemote(col,qs){
  const arr=qs.docs.map(d=>d.data()).filter(Boolean);
  arr.sort((a,b)=>NEWEST[col]?(b._o||0)-(a._o||0):(a._o||0)-(b._o||0));
  const last={};arr.forEach(x=>{last[x.id]=JSON.stringify(x)});
  SYNC.last[col]=last;SYNC.got[col]=1;
  if(!SYNC.ready&&SYNC.got.cfg&&COLS.every(c=>SYNC.got[c]))SYNC.ready=true;
  if(JSON.stringify(arr)!==JSON.stringify(DB[col])){DB[col]=arr;localSave();refreshSoon()}
}
function applyCfg(s){
  SYNC.got.cfg=1;
  if(s.exists){
    const d=s.data(),before=cfgJson();
    DB.firma=d.firma||DB.firma;DB.inhabiles=d.inhabiles||[];DB.demo=!!d.demo;DB.carteras=d.carteras&&d.carteras.length?d.carteras:DB.carteras;
    SYNC.lastCfg=cfgJson();
    if(before!==SYNC.lastCfg){localSave();refreshSoon()}
  }
  if(!SYNC.ready&&COLS.every(c=>SYNC.got[c]))SYNC.ready=true;
}
async function startSync(){
  const db=await claude.use('db');if(!db)return;
  SYNC.db=db;
  let snap;try{snap=await db.doc('config/main').get()}catch(e){syncErr(e);return}
  if(!snap.exists){SYNC.ready=true;pushRemote()}
  COLS.forEach(col=>{db.collection(col).onSnapshot(qs=>applyRemote(col,qs),syncErr)});
  db.doc('config/main').onSnapshot(applyCfg,syncErr);
  db.doc('config/admin').onSnapshot(s=>{if(s.exists){ADM.rec=s.data();try{localStorage.setItem('legajo.admin',JSON.stringify(ADM.rec))}catch(e){}}},syncErr);
}

(async function boot(){
  load();
  await cloudStart();
  render(true);
})();
})();
</script>
